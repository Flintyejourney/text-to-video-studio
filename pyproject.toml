[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "text-to-video-studio"
version = "0.6.2"
description = "Plugin-host desktop studio for text-to-video generation"
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ttv-studio maintainers" }]
dependencies = [
    "numpy>=1.26",
    "pillow>=10.3",
    "imageio-ffmpeg>=0.5.1",
    "pydantic>=2.7",
    "rich>=13.7",
    "tomli-w>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
cuda = ["torch>=2.4", "diffusers>=0.30"]
cpu = ["onnxruntime>=1.18"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "black>=24.4", "mypy>=1.10"]

[project.scripts]
ttv = "text-to-video_studio.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["text-to-video_studio"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]