# Plugin registry seed — loader merges these with discovered __init__ manifests.
# contract: one of BackendPlugin | MotionPlugin | UpscalePlugin | CaptionPlugin | ExportPlugin

[[plugin]]
id = "mock_diffusion"
module = "plugins.mock_diffusion.plugin"
contract = "BackendPlugin"
version = "0.1.0"
enabled = true

[[plugin]]
id = "optical_flow_tween"
module = "plugins.optical_flow_tween.plugin"
contract = "MotionPlugin"
version = "0.2.1"
enabled = true

[[plugin]]
id = "realesr_upscale"
module = "plugins.realesr_upscale.plugin"
contract = "UpscalePlugin"
version = "0.1.3"
enabled = false

[[plugin]]
id = "blip_caption"
module = "plugins.blip_caption.plugin"
contract = "CaptionPlugin"
version = "0.1.0"
enabled = true

[[plugin]]
id = "mp4_exporter"
module = "plugins.mp4_exporter.plugin"
contract = "ExportPlugin"
version = "0.3.0"
enabled = true